services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      [
        "mongosh",
        "--host",
        "mongo:27017",
        "--quiet",
        "--eval",
        "try { rs.status(); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); }",
      ]
    restart: "no"
  api:
    build: .
    ports: ["4000:4000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/insight?replicaSet=rs0&directConnection=true
      APP_ORIGIN: http://localhost:4000
      NODE_ENV: development
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Run node scripts/setup-env.js first}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
      SEED_DEMO: ${SEED_DEMO:-false}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
    volumes: ["uploads:/app/uploads"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    command:
      ["sh", "-c", "node server/src/seed.js && node server/src/server.js"]
  worker:
    build: .
    profiles: ["email"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/insight?replicaSet=rs0&directConnection=true
      APP_ORIGIN: http://localhost:4000
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    command: ["node", "server/src/worker.js"]
volumes:
  mongo-data:
  uploads:
